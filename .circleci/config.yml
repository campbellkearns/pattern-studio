version: 2.1

jobs:
  lint-and-test:
    resource_class: small
    docker:
      - image: cimg/node:24.20.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Test
          command: npm run test

workflows:
  on-every-push:
    jobs:
      - lint-and-test
