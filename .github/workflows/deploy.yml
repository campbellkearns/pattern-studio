# Deploys the production build to GitHub Pages on every push to main.
# Requires the repo Pages setting: Source → "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Same permissions as GitHub's official Pages starter: the deployment is
# authorized via OIDC, so no Pages-specific credentials are stored.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs finish rather than being cancelled
# so a burst of merges to main still lands the latest build last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
